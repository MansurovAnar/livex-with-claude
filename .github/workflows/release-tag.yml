name: Build and Tag Release

# Runs when a pull request into master is merged (closed without merging is ignored).
# Computes the next semantic version, builds + pushes versioned images to GHCR,
# and only after a successful build creates the git tag and GitHub Release.
#
# Version bump (first match wins):
#   major - PR label "release:major", or PR title like "feat!: ..." / body contains "BREAKING CHANGE"
#   minor - PR label "release:minor", or PR title starts with "feat"
#   patch - everything else (default)
# No previous tag -> first release is v1.0.0.

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write   # push tag + create release
  packages: write   # push images to GHCR

# Serialise runs so two quick merges can't compute the same version.
concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  build-and-tag:
    name: Build, Push & Tag
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0   # need full history + tags to find the latest version

      - name: Lowercase Repository Name
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Compute next semantic version
        id: version
        env:
          # Passed via env (not inlined) so PR text can't inject shell commands
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)

          if [[ ",$PR_LABELS," == *",release:major,"* ]] \
             || [[ "$PR_TITLE" =~ ^[a-zA-Z]+(\(.+\))?!: ]] \
             || [[ "$PR_BODY" == *"BREAKING CHANGE"* ]]; then
            BUMP=major
          elif [[ ",$PR_LABELS," == *",release:minor,"* ]] \
               || [[ "$PR_TITLE" =~ ^feat(\(.+\))?: ]]; then
            BUMP=minor
          else
            BUMP=patch
          fi

          if [[ -z "$LATEST" ]]; then
            NEXT="v1.0.0"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            case "$BUMP" in
              major) NEXT="v$((MAJOR + 1)).0.0" ;;
              minor) NEXT="v${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi

          echo "Previous tag: ${LATEST:-<none>}  bump: $BUMP  next: $NEXT"
          echo "previous=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "version=${NEXT#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/backend:${{ steps.version.outputs.tag }}
            ghcr.io/${{ env.REPO_LOWER }}/backend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ env.MERGE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/frontend:${{ steps.version.outputs.tag }}
            ghcr.io/${{ env.REPO_LOWER }}/frontend:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ env.MERGE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$MERGE_SHA" -m "$TAG - #$PR_NUMBER $PR_TITLE"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          BUMP: ${{ steps.version.outputs.bump }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## Release \`$TAG\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Previous | \`${PREVIOUS:-none}\` |"
            echo "| Bump | $BUMP |"
            echo "| Commit | \`$MERGE_SHA\` |"
            echo "| PR | #$PR_NUMBER |"
            echo "| Backend image | \`ghcr.io/$REPO_LOWER/backend:$TAG\` |"
            echo "| Frontend image | \`ghcr.io/$REPO_LOWER/frontend:$TAG\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Release tag::$TAG"
